id: iot-energy
version: 1
target_table: silver_energy

match:
  required_keys: [power, energy]

event_time_from: timestamp

columns:
  - name: power
    from: power
    type: double
    unit: unit:W
    property_iri: qudt:Power
    min: 0

  - name: energy
    from: energy
    type: double
    unit: unit:W-HR
    property_iri: qudt:Energy
    min: 0

  - name: current
    from: current
    type: double
    unit: unit:Amper
    property_iri: qudt:current
    min: 0
