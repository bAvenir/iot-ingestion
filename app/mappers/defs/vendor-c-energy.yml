id: vendor-c-energy
version: 1
target_table: silver_energy

match:
  required_keys: [readings.active_power_kw, readings.total_kwh]

event_time_from: ts
device_id_from: meter

columns:
  - name: power
    from: readings.active_power_kw
    type: double
    scale: 1000
    unit: unit:W
    property_iri: qudt:Power
    min: 0

  - name: energy
    from: readings.total_kwh
    type: double
    scale: 1000
    unit: unit:W-HR
    property_iri: qudt:Energy
    min: 0
